name: Update profile content

on:
  workflow_dispatch:
  schedule:
    # Run once a day so the profile stays current without unnecessary traffic.
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-profile-content:
    runs-on: ubuntu-latest
    steps:
      - name: Update latest posts and videos
        if: vars.PROFILE_FEEDS != ''
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Add one or more comma-separated RSS/Atom URLs as the repository
          # variable PROFILE_FEEDS. Examples:
          #   Blog: https://your-blog.example.com/rss.xml
          #   YouTube: https://www.youtube.com/feeds/videos.xml?channel_id=UC...
          feed_list: ${{ vars.PROFILE_FEEDS }}
          max_post_count: 6
          committer_username: enigmacxenosx
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          template: "- [$title]($url) · $date"
          date_format: "yyyy-mm-dd"
          comment_tag_name: BLOG-POST-LIST
          retry_count: 3
